<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>Create account</h2>
      <a routerLink="/" class="cancel-link">Cancel</a>
    </div>

    <label>Email</label>
    <input type="email" [(ngModel)]="myPayloadUser.email" />

    <label>Username</label>
    <input type="text" [(ngModel)]="myPayloadUser.username" />

    <label>Password</label>
    <input type="password" [(ngModel)]="myPayloadUser.password" />
    <small>Please provide a password of at least 8 characters</small>

       
    <div class="terms">
      <input type="checkbox" [(ngModel)]="confirmData" id="confirm" />
      <label for="confirm">I confirm new user data</label>
    </div>

    <button 
      (click)="createUser()" 
      [disabled]="!confirmData"
    >
      Create
    </button>
  </div>
</div>
